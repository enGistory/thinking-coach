[project]
name = "thinking-coach-backend"
version = "1.0"
description = "AI 语音思维训练系统后端"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.138.0",
  "uvicorn[standard]==0.49.0",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "sqlalchemy[asyncio]==2.0.51",
  "alembic==1.18.4",
  "asyncpg==0.31.0",
  "psycopg[binary,pool]==3.3.4",
  "pgvector==0.4.2",
  # LangGraph 的基础运行依赖；完整 langchain 包有意不引入。
  "langchain-core==1.4.8",
  "langgraph==1.2.6",
  "langgraph-checkpoint-postgres==3.1.0",
  "openai==2.43.0",
  "dashscope==1.25.23",
  "oss2==2.19.1",
  "httpx==0.28.1",
  "trafilatura==2.1.0",
  "pymupdf==1.27.2.3",
  "apscheduler==3.11.2",
  "tenacity==9.1.4",
  "python-multipart==0.0.32",
  "aiofiles==25.1.0",
  "pyjwt[crypto]==2.13.0",
  "pwdlib[argon2]==0.3.0",
  "email-validator==2.3.0",
  "pywebpush==2.3.0",
  "tzdata==2026.2; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "ruff==0.15.18",
  "mypy==2.1.0",
  "respx==0.23.1",
  "time-machine==3.2.0",
  "pre-commit==4.6.0",
]

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".venv", "alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_unused_configs = true
show_error_codes = true
pretty = true
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
module = [
  "dashscope.*",
  "oss2.*",
  "pywebpush.*",
  "trafilatura.*",
  "pymupdf.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "9.0"
addopts = "-q --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
  "integration: requires PostgreSQL or another external service",
  "live_ai: calls a real online model and is disabled by default",
]

[tool.coverage.run]
branch = true
source = ["app"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
