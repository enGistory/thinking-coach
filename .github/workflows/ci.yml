name: ci

on:
  pull_request:
  push:
    branches:
      - main
      - dev

env:
  UV_INDEX_URL: https://mirrors.aliyun.com/pypi/simple
  PIP_INDEX_URL: https://mirrors.aliyun.com/pypi/simple
  NPM_CONFIG_REGISTRY: https://registry.npmmirror.com

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: thinking_test
          POSTGRES_USER: thinking
          POSTGRES_PASSWORD: thinking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U thinking -d thinking_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: services/backend
    env:
      AI_PROVIDER_MODE: mock
      AUDIO_ROOT: /tmp
      JWT_SECRET: ci-jwt-secret-that-is-long-enough
      DATABASE_URL: postgresql+asyncpg://thinking:thinking@127.0.0.1:5432/thinking_test?ssl=disable
      DATABASE_SYNC_URL: postgresql+psycopg://thinking:thinking@127.0.0.1:5432/thinking_test?sslmode=disable
      TEST_DATABASE_URL: postgresql+asyncpg://thinking:thinking@127.0.0.1:5432/thinking_test?ssl=disable
      TEST_DATABASE_SYNC_URL: postgresql+psycopg://thinking:thinking@127.0.0.1:5432/thinking_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: services/backend/.python-version
      - name: Install uv
        run: python -m pip install "uv==0.11.23"
      - name: Check locked dependencies
        run: |
          uv --version
          uv lock --check
          uv sync --locked --all-groups
      - name: Verify dependency policy
        run: uv run python scripts/verify_dependency_policy.py
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy app
      - name: Test
        run: uv run pytest -q

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.26.1 --activate
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm --dir apps/web lint
      - name: Type check
        run: pnpm --dir apps/web type-check
      - name: Test
        run: pnpm --dir apps/web test
      - name: Build
        run: pnpm --dir apps/web build
