services:
  postgres:
    image: ${PGVECTOR_IMAGE:-docker.m.daocloud.io/pgvector/pgvector:pg16}
    environment:
      POSTGRES_DB: thinking
      POSTGRES_USER: thinking
      POSTGRES_PASSWORD: thinking
    ports:
      - "5432:5432"
    volumes:
      - ../data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U thinking -d thinking"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: services/backend/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-docker.m.daocloud.io/library/python:3.12.13-slim-bookworm}
        APT_MIRROR: ${APT_MIRROR:-http://mirrors.tuna.tsinghua.edu.cn/debian}
        APT_SECURITY_MIRROR: ${APT_SECURITY_MIRROR:-http://mirrors.tuna.tsinghua.edu.cn/debian-security}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
    env_file:
      - ../.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://thinking:thinking@postgres:5432/thinking
      DATABASE_SYNC_URL: postgresql+psycopg://thinking:thinking@postgres:5432/thinking
      AUDIO_ROOT: /data/audio
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ../services/backend:/app
      - ../data/audio:/data/audio
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: services/backend/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-docker.m.daocloud.io/library/python:3.12.13-slim-bookworm}
        APT_MIRROR: ${APT_MIRROR:-http://mirrors.tuna.tsinghua.edu.cn/debian}
        APT_SECURITY_MIRROR: ${APT_SECURITY_MIRROR:-http://mirrors.tuna.tsinghua.edu.cn/debian-security}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
    env_file:
      - ../.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://thinking:thinking@postgres:5432/thinking
      DATABASE_SYNC_URL: postgresql+psycopg://thinking:thinking@postgres:5432/thinking
      AUDIO_ROOT: /data/audio
    command: uv run python -m app.workers.main
    volumes:
      - ../services/backend:/app
      - ../data/audio:/data/audio
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    build:
      context: ..
      dockerfile: services/backend/Dockerfile
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:-docker.m.daocloud.io/library/python:3.12.13-slim-bookworm}
        APT_MIRROR: ${APT_MIRROR:-http://mirrors.tuna.tsinghua.edu.cn/debian}
        APT_SECURITY_MIRROR: ${APT_SECURITY_MIRROR:-http://mirrors.tuna.tsinghua.edu.cn/debian-security}
        PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
        UV_INDEX_URL: ${UV_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple}
    env_file:
      - ../.env.example
    environment:
      DATABASE_URL: postgresql+asyncpg://thinking:thinking@postgres:5432/thinking
      DATABASE_SYNC_URL: postgresql+psycopg://thinking:thinking@postgres:5432/thinking
      AUDIO_ROOT: /data/audio
    command: uv run python -m app.scheduler.main
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-docker.m.daocloud.io/library/node:22-bookworm-slim}
        APT_MIRROR: ${APT_MIRROR:-http://mirrors.tuna.tsinghua.edu.cn/debian}
        APT_SECURITY_MIRROR: ${APT_SECURITY_MIRROR:-http://mirrors.tuna.tsinghua.edu.cn/debian-security}
        NPM_CONFIG_REGISTRY: ${NPM_CONFIG_REGISTRY:-https://registry.npmmirror.com}
        PNPM_VERSION: ${PNPM_VERSION:-10.26.1}
    environment:
      VITE_DEV_API_PROXY_TARGET: http://api:8000
    command: pnpm --dir apps/web dev
    ports:
      - "5173:5173"
    depends_on:
      - api
